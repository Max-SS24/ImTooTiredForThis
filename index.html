<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav { background: #333; padding: 10px; }
        nav a { color: white; margin: 10px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 800px; margin: auto; }
        img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 20px; }

        /* Mobile-first styles (default) */
        nav { display: flex; flex-direction: column; align-items: center; }
        .menu-icon { display: block; cursor: pointer; }
        .menu-links { display: none; flex-direction: column; align-items: center; }
        nav a { margin: 10px 0; }

        /* Media Query for 600px and under (Hamburger Menu) */
        @media (max-width: 600px) {
            .menu-links.active {
                display: flex;
            }
            nav a { font-size: 16px; }
            .menu-icon {
                display: block;
                background-color: #333;
                color: white;
                padding: 10px;
                text-align: center;
                font-size: 20px;
                width: 50px;
                border-radius: 5px;
            }
        }

        /* Media Query for 768px (Tablet and below) */
        @media (max-width: 768px) {
            .container {
                width: 100%;
                padding: 0 10px;
            }
        }

        /* Media Query for 1024px (Desktop and above) */
        @media (min-width: 1024px) {
            .container {
                width: 960px;
            }
            nav {
                display: flex;
                justify-content: space-between;
            }
            nav a {
                margin: 0 20px;
            }
        }

        /* Quiz button adjustments */
        @media (max-width: 600px) {
            .btn {
                padding: 12px 30px; /* More padding for smaller buttons */
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="menu-links">
            <a href="index.html">Home</a>
            <a href="topic1.html">Tim Berners-Lee & The Web</a>
            <a href="topic2.html">Impact of HTML</a>
            <a href="references.html">References</a> 
            <a href="quiz.html">Quiz</a>
        </div>
    </nav>

    <div class="container">
        <h1>Welcome to the Web Development Journey!</h1>
        <p>This website is dedicated to exploring the life and work of Tim Berners-Lee, the inventor of the World Wide Web, as well as the importance of HTML in shaping the digital world.</p>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.querySelector('.menu-links');
            menu.classList.toggle('active');
        }
    </script>
</body>
</html>
