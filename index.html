<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        nav {
            background: #333;
            padding: 10px;
        }
        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .menu-links {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .menu-icon {
            display: none;
            font-size: 30px;
            cursor: pointer;
        }
        .menu-links.active {
            display: block;
        }
        .hero {
            text-align: center;
            margin-top: 50px;
        }
        .hero img {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 8px;
        }

        /* Mobile styles */
        @media (max-width: 600px) {
            .menu-links {
                display: none;
                width: 100%;
                text-align: center;
            }
            .menu-links.active {
                display: block;
            }
            .menu-icon {
                display: block;
            }
            .container {
                padding: 10px;
            }
        }

        /* For larger screens */
        @media (min-width: 1024px) {
            .menu-links {
                display: flex;
                justify-content: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="menu-links">
            <a href="index.html">Home</a>
            <a href="topic1.html">Tim Berners-Lee & The Web</a>
            <a href="topic2.html">Impact of HTML</a>
            <a href="references.html">References</a> 
            <a href="quiz.html">Quiz</a>
        </div>
    </nav>

    <div class="container">
        <h1>Welcome to Our Web Development Project</h1>
        <p>Learn about the evolution of the World Wide Web and HTML, and test your knowledge through our quiz!</p>
        <div class="hero">
            <img src="https://example.com/hero-image.jpg" alt="World Wide Web Image">
        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.querySelector('.menu-links');
            menu.classList.toggle('active');
        }
    </script>
</body>
</html>
