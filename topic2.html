<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impact of HTML</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav { background: #333; padding: 10px; }
        nav a { color: white; margin: 10px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 800px; margin: auto; }
        img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 20px; }

        /* Mobile-first styles (default) */
        nav { display: flex; flex-direction: column; align-items: center; }
        .menu-icon { display: block; cursor: pointer; }
        .menu-links { display: none; flex-direction: column; align-items: center; }
        nav a { margin: 10px 0; }

        /* Media Query for 600px and under (Hamburger Menu) */
        @media (max-width: 600px) {
            .menu-links.active {
                display: flex;
            }
            nav a { font-size: 16px; }
            .menu-icon {
                display: block;
                background-color: #333;
                color: white;
                padding: 10px;
                text-align: center;
                font-size: 20px;
                width: 50px;
                border-radius: 5px;
            }
        }

        /* Media Query for 768px (Tablet and below) */
        @media (max-width: 768px) {
            .container {
                width: 100%;
                padding: 0 10px;
            }
        }

                width: 960px;
