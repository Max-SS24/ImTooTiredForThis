<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>References</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav { background: #333; padding: 10px; }
        nav a { color: white; margin: 10px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 800px; margin: auto; }
        ul { list-style-type: square; margin-left: 20px; }
        .menu-icon { display: block; cursor: pointer; }
        .menu-links { display: none; flex-direction: column; align-items: center; }
        nav a { margin: 10px 0; }

        /* Mobile-first styles (default) */
        nav { display: flex; flex-direction: column; align-items: center; }

        /* Media Query for 600px and under (Hamburger Menu) */
        @media (max-width: 600px) {
            .menu-links.active {
                display: flex;
            }
            nav a { font-size: 16px; }
            .menu-icon {
                display: block;
                background-color: #333;
                color: white;
                padding: 10px;
                text-align: center;
                font-size: 20px;
                width: 50px;
                border-radius: 5px;
            }
        }

        /* Media Query for 768px (Tablet and below) */
        @media (max-width: 768px) {
            .container {
                width: 100%;
                padding: 0 10px;
            }
        }

        /* Media Query for 1024px (Desktop and above) */
        @media (min-width: 1024px) {
            .container {
                width: 960px;
            }
            nav {
                display: flex;
                justify-content: space-between;
            }
            nav a {
                margin: 0 20px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="menu-links">
            <a href="index.html">Home</a>
            <a href="topic1.html">Tim Berners-Lee & The Web</a>
            <a href="topic2.html">Impact of HTML</a>
            <a href="references.html">References</a> 
            <a href="quiz.html">Quiz</a>
        </div>
    </nav>

    <div class="container">
        <h1>References</h1>
        <p>Below are some of the sources that contributed to the content in this website:</p>
        <ul>
            <li><a href="https://www.w3.org/History.html" target="_blank">History of the World Wide Web - W3C</a></li>
            <li><a href="https://en.wikipedia.org/wiki/HTML" target="_blank">HTML - Wikipedia</a></li>
            <li><a href="https://www.cnn.com/1993/TECH/07/06/web.launch/" target="_blank">The Web Revolution Begins - CNN</a></li>
        </ul>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.querySelector('.menu-links');
            menu.classList.toggle('active');
        }
    </script>
</body>
</html>
