<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        nav {
            background: #333;
            padding: 0;
            margin: 0;
            width: 100%;
        }
        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .menu-links {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .menu-icon {
            display: none;
            font-size: 30px;
            cursor: pointer;
        }
        .menu-links.active {
            display: block;
        }
        .container {
            max-width: 1000px; /* Match the width from the index file */
            margin: auto;
            padding: 20px;
        }

        /* Mobile styles */
        @media (max-width: 600px) {
            .menu-links {
                display: none;
                width: 100%;
                text-align: center;
            }
            .menu-links.active {
                display: block;
            }
            .menu-icon {
                display: block;
            }
            .container {
                padding: 10px;
            }
        }

        /* For larger screens */
        @media (min-width: 1024px) {
            .menu-links {
                display: flex;
                justify-content: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="menu-links">
            <a href="index.html">Home</a>
            <a href="topic1.html">Tim Berners-Lee & The Web</a>
            <a href="topic2.html">Impact of HTML</a>
            <a href="references.html">References</a> 
            <a href="quiz.html">Quiz</a>
        </div>
    </nav>  
    <div class="container">
        <h1>Quiz: Test Your Knowledge</h1>
        <form id="quizForm" onsubmit="return checkQuiz()">
            <h2>1. Who invented the World Wide Web?</h2>
            <label><input type="radio" name="q1" value="a"> Bill Gates</label><br>
            <label><input type="radio" name="q1" value="b"> Tim Berners-Lee</label><br>
            <label><input type="radio" name="q1" value="c"> Steve Jobs</label><br>

            <h2>2. What does HTML stand for?</h2>
            <label><input type="radio" name="q2" value="a"> HyperText Markup Language</label><br>
            <label><input type="radio" name="q2" value="b"> HighText Machine Language</label><br>
            <label><input type="radio" name="q2" value="c"> Hyper Transfer Markup Language</label><br>

            <h2>3. What does URI stand for?</h2>
            <label><input type="radio" name="q3" value="a"> Uniform Resource Identifier</label><br>
            <label><input type="radio" name="q3" value="b"> Universal Resource Identifier</label><br>
            <label><input type="radio" name="q3" value="c"> Uniform Resource Interface</label><br>

            <h2>4. In what year did the World Wide Web become publicly available?</h2>
            <label><input type="radio" name="q4" value="a"> 1990</label><br>
            <label><input type="radio" name="q4" value="b"> 1993</label><br>
            <label><input type="radio" name="q4" value="c"> 1995</label><br>

            <h2>5. What does HTTP stand for?</h2>
            <label><input type="radio" name="q5" value="a"> HyperText Transfer Protocol</label><br>
            <label><input type="radio" name="q5" value="b"> HyperText Translation Protocol</label><br>
            <label><input type="radio" name="q5" value="c"> HyperText Technology Protocol</label><br>

            <br><br>
            <button type="submit">Submit Quiz</button>
        </form>
        
        <div id="result" style="display:none;">
            <h2 id="resultMessage"></h2>
            <button onclick="window.location.reload();">Retake Quiz</button>
        </div>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.querySelector('.menu-links');
            menu.classList.toggle('active');
        }

        function checkQuiz() {
            const answers = {
                q1: "b", // Tim Berners-Lee
                q2: "a", // HyperText Markup Language
                q3: "a", // Uniform Resource Identifier
                q4: "b", // 1993
                q5: "a"  // HyperText Transfer Protocol
            };

            let score = 0;
            const form = document.forms["quizForm"];

            // Check answers
            for (let question in answers) {
                const selectedAnswer = form[question].value;
                if (selectedAnswer === answers[question]) {
                    score++;
                }
            }

            // Display result
            const resultDiv = document.getElementById('result');
            const resultMessage = document.getElementById('resultMessage');
            if (score >= 4) {
                resultMessage.innerText = `Congratulations! You passed the quiz with a score of ${score} out of 5.`;
            } else {
                resultMessage.innerText = `You failed the quiz. You scored ${score} out of 5. Try again!`;
            }
            resultDiv.style.display = "block";
            return false; // Prevent form submission
        }
    </script>
</body>
</html>
