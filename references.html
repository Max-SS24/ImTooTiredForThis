<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>References and Resources</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        nav {
            background: #333;
            padding: 10px;
        }
        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .menu-links {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .menu-icon {
            display: none;
            font-size: 30px;
            cursor: pointer;
        }
        .menu-links.active {
            display: block;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        /* Mobile styles */
        @media (max-width: 600px) {
            .menu-links {
                display: none;
                width: 100%;
                text-align: center;
            }
            .menu-links.active {
                display: block;
            }
            .menu-icon {
                display: block;
            }
            .container {
                padding: 10px;
            }
        }

        /* For larger screens */
        @media (min-width: 1024px) {
            .menu-links {
                display: flex;
                justify-content: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="menu-icon" onclick="toggleMenu()">☰</div>
        <div class="menu-links">
            <a href="index.html">Home</a>
            <a href="topic1.html">Tim Berners-Lee & The Web</a>
            <a href="topic2.html">Impact of HTML</a>
            <a href="references.html">References</a> 
            <a href="quiz.html">Quiz</a>
        </div>
    </nav>

    <div class="container">
        <h1>References & Resources</h1>
        <p>Below are the sources referenced in this research:</p>
        <ul>
            <li><a href="https://webfoundation.org/about/vision/history-of-the-web/">History of the Web - World Wide Web Foundation (2020)</a></li>
            <li><a href="https://www.w3.org/People/Berners-Lee/Weaving/Overview.html">Weaving the Web - Berners-Lee (n.d.)</a></li>
            <li><a href="https://web.dev/learn/html/overview">Overview of HTML - web.dev (n.d.)</a></li>
        </ul>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.querySelector('.menu-links');
            menu.classList.toggle('active');
        }
    </script>
</body>
</html>
